<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Concurrence Charente</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#111827;color:white;padding:18px 14px 14px;position:sticky;top:0;z-index:1000}
h1{font-size:21px;margin:0 0 5px}.sub{font-size:13px;opacity:.75}
.bar{display:flex;gap:8px;margin-top:12px}.bar input,.bar select{border:0;border-radius:12px;padding:12px;font-size:15px}.bar input{flex:1}.bar select{width:110px}
.actions{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;background:white;position:sticky;top:83px;z-index:999}
button{border:1px solid #dfe3e8;background:white;border-radius:12px;padding:11px 13px;font-weight:700;white-space:nowrap;font-size:14px;touch-action:manipulation}
.primary{background:#111827;color:white;border-color:#111827}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px 14px}.stat{background:white;border:1px solid #e1e5e9;border-radius:14px;text-align:center;padding:10px}.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:#6b7280}
#map{height:43vh;min-height:310px}.panel{padding:12px 14px}.list{display:grid;gap:10px}.item{background:white;border:1px solid #e1e5e9;border-radius:16px;padding:12px}.item h3{margin:0 0 5px;font-size:15px}.meta{font-size:12px;color:#6b7280;line-height:1.45}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.tag{padding:5px 8px;border-radius:999px;background:#eef2f7;font-size:11px}.p1{background:#fee2e2;color:#991b1b}.p2{background:#fef3c7;color:#92400e}.p3{background:#dcfce7;color:#166534}.visited{background:#dcfce7;color:#166534}.itemActions{display:flex;gap:7px;margin-top:10px}.itemActions button{flex:1;font-size:12px;padding:9px}.empty{text-align:center;color:#6b7280;padding:30px}.loading{text-align:center;padding:10px;color:#6b7280;font-size:12px}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:3000;align-items:flex-end}.sheet{background:white;width:100%;max-height:88vh;border-radius:22px 22px 0 0;padding:16px;overflow:auto}.sheet h2{margin:0 0 8px}.sheet textarea{width:100%;min-height:120px;border:1px solid #ddd;border-radius:12px;padding:10px;font:inherit;margin:12px 0}.close{float:right}
@media(min-width:900px){#map{height:55vh}.list{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header>
<h1>📍 Concurrence Charente</h1>
<div class="sub">Carnet terrain — repérer, visiter, suivre</div>
<div class="bar"><input id="q" placeholder="Rechercher une enseigne, ville, adresse…"><select id="prio"><option value="">Priorité</option><option value="1">P1</option><option value="2">P2</option><option value="3">P3</option></select></div>
</header>

<div class="actions">
<button class="primary" type="button" onclick="APP.near()">📍 Autour de moi</button>
<button type="button" onclick="APP.all()">Tout afficher</button>
<button type="button" onclick="APP.tour()">🗺️ Ma tournée</button>
<button type="button" onclick="APP.backup()">💾 Sauvegarde</button>
<button type="button" onclick="APP.restore()">↩️ Restaurer</button>
<input id="file" type="file" accept="application/json" hidden>
</div>

<div class="stats">
<div class="stat"><b id="total">226</b><span>Total</span></div>
<div class="stat"><b id="p1">0</b><span>P1</span></div>
<div class="stat"><b id="vis">0</b><span>Visités</span></div>
<div class="stat"><b id="todo">0</b><span>À visiter</span></div>
</div>

<div id="loading" class="loading" style="display:none">Géolocalisation des adresses…</div>
<div id="map"></div>
<main class="panel"><div id="list" class="list"></div></main>

<div id="modal" class="modal">
<div class="sheet">
<button class="close" type="button" onclick="APP.close()">✕</button>
<h2 id="mh"></h2><div id="md" class="meta"></div><div id="mt" class="tags"></div>
<textarea id="notes" placeholder="Notes de visite…"></textarea>
<button class="primary" type="button" onclick="APP.saveNote()">Enregistrer</button>
</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="data.js"></script>
<script>
(function(){
"use strict";
const KEY="cc_tracking_v4";
let state=JSON.parse(localStorage.getItem(KEY)||"{}");
let coords=JSON.parse(localStorage.getItem("cc_coords")||"{}");
let current=null,userMarker=null,markers=[];
const map=L.map("map").setView([45.65,0.15],9);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap contributors"}).addTo(map);
L.control.zoom({position:"bottomright"}).addTo(map);

function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function get(i){return state[String(i)]||{}}
function dist(a,b){const R=6371,dLat=(b[0]-a[0])*Math.PI/180,dLon=(b[1]-a[1])*Math.PI/180,A=Math.sin(dLat/2)**2+Math.cos(a[0]*Math.PI/180)*Math.cos(b[0]*Math.PI/180)*Math.sin(dLon/2)**2;return R*2*Math.atan2(Math.sqrt(A),Math.sqrt(1-A))}
function filtered(){const q=document.getElementById("q").value.trim().toLowerCase(),p=document.getElementById("prio").value;return CONCURRENTS.map((x,i)=>({...x,i})).filter(x=>(!q||[x.enseigne,x.commune,x.adresse,x.cp,x.groupe].join(" ").toLowerCase().includes(q))&&(!p||x.priorite===p))}
function stats(){document.getElementById("total").textContent=CONCURRENTS.length;document.getElementById("p1").textContent=CONCURRENTS.filter(x=>x.priorite==="1").length;const n=Object.values(state).filter(x=>x.visited).length;document.getElementById("vis").textContent=n;document.getElementById("todo").textContent=CONCURRENTS.length-n}
function clearMarkers(){markers.forEach(m=>map.removeLayer(m));markers=[]}
function markersFor(arr){clearMarkers();arr.forEach(x=>{if(coords[x.i])markers.push(L.marker(coords[x.i]).addTo(map).bindPopup("<b>"+esc(x.enseigne)+"</b><br>"+esc(x.commune)+"<br><button type='button' onclick='APP.card("+x.i+")'>Fiche</button>"))})}
function render(arr=filtered(),fit=false){stats();document.getElementById("list").innerHTML=arr.length?arr.map(x=>{const s=get(x.i);return "<article class='item'><h3>"+esc(x.enseigne||"Sans enseigne")+"</h3><div class='meta'>"+esc(x.adresse)+"<br>"+esc(x.cp)+" "+esc(x.commune)+(x.groupe?" · "+esc(x.groupe):"")+"</div><div class='tags'><span class='tag "+(x.priorite==="1"?"p1":x.priorite==="2"?"p2":"p3")+"'>P"+esc(x.priorite||"—")+"</span>"+(s.visited?"<span class='tag visited'>✓ Visité</span>":"")+"</div><div class='itemActions'><button type='button' onclick='APP.card("+x.i+")'>Fiche</button><button type='button' onclick='APP.nav("+x.i+")'>🚗 Itinéraire</button><button type='button' onclick='APP.visit("+x.i+")'>"+(s.visited?"↩️ À revoir":"✓ Visité")+"</button></div></article>"}).join(""):"<div class='empty'>Aucun concurrent ne correspond aux filtres.</div>";markersFor(arr);if(fit){const pts=arr.map(x=>coords[x.i]).filter(Boolean);if(pts.length===1)map.setView(pts[0],13);else if(pts.length>1)map.fitBounds(L.latLngBounds(pts),{padding:[25,25],maxZoom:12})}}
async function geocode(list){const missing=list.filter(x=>!coords[x.i]).slice(0,20);if(!missing.length)return;document.getElementById("loading").style.display="block";for(const x of missing){try{const q=encodeURIComponent(x.adresse+", "+x.cp+" "+x.commune+", France");const r=await fetch("https://api-adresse.data.gouv.fr/search/?q="+q+"&limit=1");const j=await r.json();if(j.features&&j.features[0]){const c=j.features[0].geometry.coordinates;coords[x.i]=[c[1],c[0]];localStorage.setItem("cc_coords",JSON.stringify(coords))}}catch(e){}await new Promise(r=>setTimeout(r,150))}document.getElementById("loading").style.display="none";render()}
function card(i){current=i;const x=CONCURRENTS[i],s=get(i);document.getElementById("mh").textContent=x.enseigne||"Concurrent";document.getElementById("md").innerHTML=esc(x.adresse)+"<br>"+esc(x.cp)+" "+esc(x.commune)+(x.groupe?"<br>"+esc(x.groupe):"");document.getElementById("mt").innerHTML="<span class='tag "+(x.priorite==="1"?"p1":x.priorite==="2"?"p2":"p3")+"'>Priorité P"+esc(x.priorite||"—")+"</span>";document.getElementById("notes").value=s.notes||"";document.getElementById("modal").style.display="flex"}
function close(){document.getElementById("modal").style.display="none";current=null}
function visit(i){const s=get(i);s.visited=!s.visited;s.date=s.visited?new Date().toISOString():"";state[String(i)]=s;save();render()}
function nav(i){const x=CONCURRENTS[i];location.href="https://maps.apple.com/?address="+encodeURIComponent(x.adresse+", "+x.cp+" "+x.commune+", France")}
function near(){if(!navigator.geolocation){alert("Géolocalisation indisponible");return}navigator.geolocation.getCurrentPosition(pos=>{const c=[pos.coords.latitude,pos.coords.longitude];if(userMarker)map.removeLayer(userMarker);userMarker=L.circleMarker(c,{radius:9}).addTo(map).bindPopup("Vous êtes ici").openPopup();map.setView(c,12);let arr=CONCURRENTS.map((x,i)=>({...x,i})).filter(x=>coords[x.i]).sort((a,b)=>dist(c,coords[a.i])-dist(c,coords[b.i])).slice(0,20);if(!arr.length){geocode(CONCURRENTS.slice(0,20));alert("Je prépare les premières adresses sur la carte. Appuie à nouveau sur « Autour de moi » dans quelques secondes.");return}document.getElementById("q").value="";document.getElementById("prio").value="";document.getElementById("list").innerHTML=arr.map(x=>"<article class='item'><h3>"+esc(x.enseigne)+"</h3><div class='meta'>"+esc(x.adresse)+"<br>"+esc(x.cp)+" "+esc(x.commune)+"</div><div class='tags'><span class='tag'>"+dist(c,coords[x.i]).toFixed(1)+" km</span></div><div class='itemActions'><button type='button' onclick='APP.card("+x.i+")'>Fiche</button><button type='button' onclick='APP.nav("+x.i+")'>🚗 Itinéraire</button><button type='button' onclick='APP.visit("+x.i+")'>"+(get(x.i).visited?"↩️ À revoir":"✓ Visité")+"</button></div></article>").join("");markersFor(arr)},()=>alert("Autorise la localisation pour ce site dans Réglages > Confidentialité et sécurité > Service de localisation."),{enableHighAccuracy:true,timeout:10000,maximumAge:60000})}
function all(){document.getElementById("q").value="";document.getElementById("prio").value="";render(filtered(),true);window.scrollTo(0,0)}
function tour(){const arr=filtered().filter(x=>!get(x.i).visited).slice(0,10);if(!arr.length){alert("Aucun concurrent à visiter dans la sélection.");return}nav(arr[0].i)}
function backup(){const blob=new Blob([JSON.stringify({state,coords},null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="concurrence-charente-sauvegarde.json";document.body.appendChild(a);a.click();a.remove()}
function restore(){document.getElementById("file").click()}
function saveNote(){if(current===null)return;const s=get(current);s.notes=document.getElementById("notes").value;state[String(current)]=s;save();close();render()}

window.APP={near,all,tour,backup,restore,card,close,visit,nav,saveNote};
document.getElementById("q").addEventListener("input",()=>render());
document.getElementById("prio").addEventListener("change",()=>render());
document.getElementById("file").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);state=j.state||{};coords=j.coords||{};save();localStorage.setItem("cc_coords",JSON.stringify(coords));render();alert("Sauvegarde restaurée.")}catch(_){alert("Fichier invalide.")}};r.readAsText(f)});
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")close()});

render();
geocode(CONCURRENTS.slice(0,20));
})();
</script>
</body>
</html>
