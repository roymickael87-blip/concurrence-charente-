<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Concurrence Charente</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#111827;color:#fff;padding:18px 14px 14px}h1{margin:0;font-size:22px}.sub{margin-top:5px;color:#cbd5e1;font-size:13px}
.search{display:flex;gap:8px;margin-top:13px}.search input,.search select{border:0;border-radius:12px;padding:13px;font-size:16px}.search input{flex:1}.search select{width:110px}
.actions{display:flex;gap:8px;overflow:auto;background:#fff;padding:10px 12px;border-bottom:1px solid #ddd}
button{font:inherit;font-weight:700;border:1px solid #d1d5db;background:#fff;border-radius:12px;padding:11px 14px;touch-action:manipulation}.primary{background:#111827;color:#fff}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:10px 12px}.stat{background:#fff;border:1px solid #ddd;border-radius:13px;text-align:center;padding:9px}.stat b{display:block;font-size:20px}.stat small{color:#6b7280}
#map{height:310px;margin:0 12px 10px;border-radius:16px;overflow:hidden;border:1px solid #d1d5db;background:#dce9d4}
.mapmsg{padding:8px 14px;text-align:center;color:#6b7280;font-size:12px}
.panel{padding:0 12px 30px}.item{background:#fff;border:1px solid #ddd;border-radius:15px;padding:12px;margin-bottom:9px}.item h3{font-size:15px;margin:0 0 5px}.meta{font-size:12px;color:#6b7280;line-height:1.45}.tags{margin-top:7px}.tag{display:inline-block;border-radius:999px;background:#eef2f7;padding:4px 8px;font-size:11px}.p1{background:#fee2e2;color:#991b1b}.p2{background:#fef3c7;color:#92400e}.p3{background:#dcfce7;color:#166534}.itemActions{display:flex;gap:6px;margin-top:10px}.itemActions button{flex:1;padding:9px 5px;font-size:12px}
.modal{display:none;position:fixed;z-index:3000;inset:0;background:#0008;align-items:flex-end}.sheet{background:#fff;border-radius:20px 20px 0 0;padding:18px;width:100%;max-height:85vh;overflow:auto}.sheet textarea{width:100%;height:120px;margin:12px 0;border:1px solid #ddd;border-radius:12px;padding:10px;font:inherit}.sheet h2{margin:0 0 8px}.close{float:right}.loading{text-align:center;padding:7px;color:#6b7280;font-size:12px}
</style>
</head>
<body>
<header><h1>📍 Concurrence Charente</h1><div class="sub">Carnet terrain — repérer, visiter, suivre</div>
<div class="search"><input id="q" placeholder="Enseigne, ville, adresse"><select id="prio"><option value="">Priorité</option><option value="1">P1</option><option value="2">P2</option><option value="3">P3</option></select></div></header>
<div class="actions">
<button id="near" class="primary">📍 Autour de moi</button><button id="all">Tout afficher</button><button id="tour">🗺️ Ma tournée</button><button id="backup">💾 Sauvegarde</button><button id="restore">↩️ Restaurer</button>
<input id="file" type="file" accept="application/json" hidden>
</div>
<div class="stats"><div class="stat"><b id="total">226</b><small>Total</small></div><div class="stat"><b id="p1">0</b><small>P1</small></div><div class="stat"><b id="vis">0</b><small>Visités</small></div><div class="stat"><b id="todo">0</b><small>À visiter</small></div></div>
<div id="map"></div><div id="loading" class="loading">Chargement des adresses sur la carte…</div>
<div class="panel"><div id="list"></div></div>
<div id="modal" class="modal"><div class="sheet"><button id="close" class="close">✕</button><h2 id="mh"></h2><div id="md" class="meta"></div><div id="mt" class="tags"></div><textarea id="notes" placeholder="Notes de visite…"></textarea><button id="save" class="primary">Enregistrer</button></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="data.js"></script>
<script>
(function(){
const KEY="cc_v6_data"; let state={}; try{state=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
let coords={}; try{coords=JSON.parse(localStorage.getItem("cc_coords")||"{}")}catch(e){}
let current=null,userMarker=null,markers=[];
const map=L.map("map").setView([45.65,0.15],9);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap contributors"}).addTo(map);
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function esc(v){return String(v||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function st(i){return state[i]||{}}
function filtered(){const q=document.getElementById("q").value.toLowerCase().trim(),p=document.getElementById("prio").value;return CONCURRENTS.map((x,i)=>({x,i})).filter(o=>{const x=o.x,t=[x.enseigne,x.commune,x.adresse,x.cp,x.groupe].join(" ").toLowerCase();return(!q||t.includes(q))&&(!p||x.priorite===p)})}
function stats(){document.getElementById("total").textContent=CONCURRENTS.length;document.getElementById("p1").textContent=CONCURRENTS.filter(x=>x.priorite==="1").length;const n=Object.values(state).filter(x=>x.visited).length;document.getElementById("vis").textContent=n;document.getElementById("todo").textContent=CONCURRENTS.length-n}
function clearMarkers(){markers.forEach(m=>map.removeLayer(m));markers=[]}
function draw(arr){clearMarkers();arr.forEach(o=>{if(coords[o.i]){const x=o.x;markers.push(L.marker(coords[o.i]).addTo(map).bindPopup("<b>"+esc(x.enseigne)+"</b><br>"+esc(x.adresse)+"<br>"+esc(x.cp)+" "+esc(x.commune)))}})}
function fit(arr){const pts=arr.map(o=>coords[o.i]).filter(Boolean);if(pts.length===1)map.setView(pts[0],14);else if(pts.length>1)map.fitBounds(L.latLngBounds(pts),{padding:[20,20],maxZoom:12})}
function render(arr){arr=arr||filtered();stats();let out="";arr.slice(0,100).forEach(o=>{const x=o.x,z=st(o.i);out+="<article class='item'><h3>"+esc(x.enseigne||"Sans enseigne")+"</h3><div class='meta'>"+esc(x.adresse)+"<br>"+esc(x.cp)+" "+esc(x.commune)+(x.groupe?" · "+esc(x.groupe):"")+"</div><div class='tags'><span class='tag "+(x.priorite==="1"?"p1":x.priorite==="2"?"p2":"p3")+"'>P"+esc(x.priorite||"—")+"</span>"+(z.visited?" <span class='tag'>✓ Visité</span>":"")+"</div><div class='itemActions'><button class='fiche' data-i='"+o.i+"'>Fiche</button><button class='itin' data-i='"+o.i+"'>🚗 Itinéraire</button><button class='visit' data-i='"+o.i+"'>"+(z.visited?"↩️ À revoir":"✓ Visité")+"</button></div></article>"});document.getElementById("list").innerHTML=out||"<div class='mapmsg'>Aucun concurrent trouvé.</div>";draw(arr)}
async function geocode(){const arr=CONCURRENTS.map((x,i)=>({x,i})).filter(o=>!coords[o.i]).slice(0,30);if(!arr.length){render();return}document.getElementById("loading").textContent="Géolocalisation des adresses…";for(const o of arr){try{const q=encodeURIComponent(o.x.adresse+", "+o.x.cp+" "+o.x.commune+", France");const r=await fetch("https://api-adresse.data.gouv.fr/search/?q="+q+"&limit=1");const j=await r.json();if(j.features&&j.features[0]){const c=j.features[0].geometry.coordinates;coords[o.i]=[c[1],c[0]];localStorage.setItem("cc_coords",JSON.stringify(coords))}}catch(e){}await new Promise(r=>setTimeout(r,120))}document.getElementById("loading").textContent="";render()}
function card(i){current=i;const x=CONCURRENTS[i],z=st(i);document.getElementById("mh").textContent=x.enseigne||"Concurrent";document.getElementById("md").innerHTML=esc(x.adresse)+"<br>"+esc(x.cp)+" "+esc(x.commune)+(x.groupe?"<br>"+esc(x.groupe):"");document.getElementById("mt").innerHTML="<span class='tag "+(x.priorite==="1"?"p1":x.priorite==="2"?"p2":"p3")+"'>Priorité P"+esc(x.priorite||"—")+"</span>";document.getElementById("notes").value=z.notes||"";document.getElementById("modal").style.display="flex"}
function visit(i){const z=st(i);z.visited=!z.visited;z.date=z.visited?new Date().toISOString():"";state[i]=z;save();render()}
function nav(i){const x=CONCURRENTS[i];location.href="https://maps.apple.com/?address="+encodeURIComponent(x.adresse+", "+x.cp+" "+x.commune+", France")}
document.getElementById("list").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const i=Number(b.dataset.i);if(b.classList.contains("fiche"))card(i);if(b.classList.contains("itin"))nav(i);if(b.classList.contains("visit"))visit(i)});
document.getElementById("q").addEventListener("input",()=>render());document.getElementById("prio").addEventListener("change",()=>render());
document.getElementById("all").addEventListener("click",()=>{document.getElementById("q").value="";document.getElementById("prio").value="";const a=filtered();render(a);fit(a);map.setView([45.65,0.15],9)});
document.getElementById("near").addEventListener("click",()=>{if(!navigator.geolocation){alert("Géolocalisation indisponible");return}navigator.geolocation.getCurrentPosition(pos=>{const c=[pos.coords.latitude,pos.coords.longitude];if(userMarker)map.removeLayer(userMarker);userMarker=L.circleMarker(c,{radius:9}).addTo(map).bindPopup("Vous êtes ici").openPopup();map.setView(c,12);const a=CONCURRENTS.map((x,i)=>({x,i})).filter(o=>coords[o.i]).sort((a,b)=>{const d=(p)=>{const R=6371,la=(p[0]-c[0])*Math.PI/180,lo=(p[1]-c[1])*Math.PI/180,A=Math.sin(la/2)**2+Math.cos(c[0]*Math.PI/180)*Math.cos(p[0]*Math.PI/180)*Math.sin(lo/2)**2;return R*2*Math.atan2(Math.sqrt(A),Math.sqrt(1-A))};return d(coords[a.i])-d(coords[b.i])}).slice(0,20);render(a);if(!a.length)alert("Les adresses ne sont pas encore géolocalisées. Attends quelques secondes puis réessaie.")},()=>alert("Autorise la localisation pour Safari dans Réglages."),{enableHighAccuracy:true,timeout:10000,maximumAge:60000})});
document.getElementById("tour").addEventListener("click",()=>{const a=filtered().filter(o=>!st(o.i).visited).slice(0,10);if(a.length)nav(a[0].i);else alert("Aucun concurrent à visiter.")});
document.getElementById("backup").addEventListener("click",()=>{const blob=new Blob([JSON.stringify({state,coords},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="concurrence-charente-sauvegarde.json";document.body.appendChild(a);a.click();a.remove()});
document.getElementById("restore").addEventListener("click",()=>document.getElementById("file").click());
document.getElementById("file").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);state=j.state||{};coords=j.coords||{};save();localStorage.setItem("cc_coords",JSON.stringify(coords));render();alert("Sauvegarde restaurée.")}catch(_){alert("Fichier invalide.")}};r.readAsText(f)});
document.getElementById("close").addEventListener("click",()=>document.getElementById("modal").style.display="none");
document.getElementById("save").addEventListener("click",()=>{if(current===null)return;const z=st(current);z.notes=document.getElementById("notes").value;state[current]=z;save();document.getElementById("modal").style.display="none";render()});
render();geocode();
})();
</script>
</body></html>
