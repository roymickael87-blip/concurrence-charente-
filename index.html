<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Concurrence Charente"><link rel="manifest" href="manifest.json"><link rel="icon" href="data:,"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><title>Concurrence Charente</title><style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--accent:#111827;--ok:#15803d;--warn:#b45309}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}header{position:sticky;top:0;z-index:1000;background:rgba(17,24,39,.96);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 12px}h1{font-size:20px;margin:0 0 8px;font-weight:800}.sub{font-size:12px;opacity:.75}.bar{display:flex;gap:8px;margin-top:10px}.bar input,.bar select{border:0;border-radius:12px;padding:11px 12px;font-size:15px;min-width:0}.bar input{flex:1}.bar select{width:108px}.actions{display:flex;gap:8px;overflow:auto;padding:10px 14px;background:#fff;border-bottom:1px solid var(--line)}button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;font-weight:700;white-space:nowrap}button.primary{background:#111827;color:#fff;border-color:#111827}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px 14px}.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:var(--muted)}#map{height:46vh;min-height:330px;background:#ddd}.panel{padding:12px 14px}.list{display:grid;gap:10px}.item{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px}.item h3{font-size:15px;margin:0 0 5px}.meta{font-size:12px;color:var(--muted);line-height:1.45}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.tag{font-size:11px;padding:5px 8px;border-radius:999px;background:#eef2f7}.p1{background:#fee2e2;color:#991b1b}.p2{background:#fef3c7;color:#92400e}.p3{background:#dcfce7;color:#166534}.visited{background:#dcfce7;color:#166534}.itemActions{display:flex;gap:7px;margin-top:10px}.itemActions button{flex:1;font-size:12px;padding:8px}.empty{padding:30px;text-align:center;color:var(--muted)}.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:3000;display:none;align-items:flex-end}.sheet{background:#fff;width:100%;max-height:88vh;border-radius:22px 22px 0 0;padding:16px;overflow:auto}.sheet h2{margin:0 0 6px;font-size:20px}.sheet textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:12px;padding:10px;font:inherit;margin:10px 0}.close{float:right}.small{font-size:12px;color:var(--muted)}.loading{padding:12px 14px;font-size:12px;color:var(--muted);display:none}@media(min-width:900px){#map{height:55vh}.list{grid-template-columns:repeat(3,1fr)}}
</style></head><body><header><h1>📍 Concurrence Charente</h1><div class="sub">Carnet terrain — repérer, visiter, suivre</div><div class="bar"><input id="q" placeholder="Rechercher une enseigne, ville, adresse…"><select id="prio"><option value="">Priorité</option><option value="1">P1</option><option value="2">P2</option><option value="3">P3</option></select></div></header><div class="actions"><button class="primary" id="near">📍 Autour de moi</button><button id="all">Tout afficher</button><button id="tour">🗺️ Ma tournée</button><button id="backup">💾 Sauvegarde</button><button id="restore">↩️ Restaurer</button><input id="file" type="file" accept="application/json" hidden></div><div class="stats"><div class="stat"><b id="nTotal">226</b><span>Total</span></div><div class="stat"><b id="nP1">0</b><span>P1</span></div><div class="stat"><b id="nVisit">0</b><span>Visités</span></div><div class="stat"><b id="nTodo">0</b><span>À visiter</span></div></div><div id="loading" class="loading">Recherche des adresses sur la carte…</div><div id="map"></div><main class="panel"><div id="list" class="list"></div></main><div id="modal" class="modal"><div class="sheet"><button class="close" id="close">✕</button><h2 id="mh"></h2><div id="md" class="meta"></div><div class="tags" id="mt"></div><textarea id="notes" placeholder="Notes de visite…"></textarea><button class="primary" id="save">Enregistrer</button></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="data.js"></script><script>
const KEY='cc_tracking_v1';let state=JSON.parse(localStorage.getItem(KEY)||'{}');let map=L.map('map',{zoomControl:false}).setView([45.65,0.15],9);L.control.zoom({position:'bottomright'}).addTo(map);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}).addTo(map);let markers=[],coords=JSON.parse(localStorage.getItem('cc_coords')||'{}'),current=null,userMarker=null;
function save(){localStorage.setItem(KEY,JSON.stringify(state))}function key(i){return String(i)}function filtered(){let q=document.getElementById('q').value.toLowerCase().trim(),p=document.getElementById('prio').value;return CONCURRENTS.map((x,i)=>({...x,i})).filter(x=>(!q||[x.enseigne,x.commune,x.adresse,x.cp,x.groupe].join(' ').toLowerCase().includes(q))&&(!p||x.priorite===p))}
function stats(){document.getElementById('nTotal').textContent=CONCURRENTS.length;document.getElementById('nP1').textContent=CONCURRENTS.filter(x=>x.priorite==='1').length;document.getElementById('nVisit').textContent=Object.values(state).filter(x=>x.visited).length;document.getElementById('nTodo').textContent=CONCURRENTS.length-Object.values(state).filter(x=>x.visited).length}
function render(){stats();let arr=filtered();let list=document.getElementById('list');list.innerHTML=arr.length?arr.slice(0,80).map(x=>{let s=state[key(x.i)]||{};return `<article class="item"><h3>${esc(x.enseigne||'Sans enseigne')}</h3><div class="meta">${esc(x.adresse)}<br>${esc(x.cp)} ${esc(x.commune)}${x.groupe?' · '+esc(x.groupe):''}</div><div class="tags"><span class="tag ${x.priorite==='1'?'p1':x.priorite==='2'?'p2':'p3'}">P${esc(x.priorite||'3')}</span>${s.visited?'<span class="tag visited">✓ Visité</span>':''}${x.statut&&x.statut!=='OK'?'<span class="tag">'+esc(x.statut)+'</span>':''}</div><div class="itemActions"><button onclick="openCard(${x.i})">Fiche</button><button onclick="navigate(${x.i})">🚗 Itinéraire</button><button onclick="toggleVisit(${x.i})">${s.visited?'↩️ À revoir':'✓ Visité'}</button></div></article>`}).join(''):'<div class="empty">Aucun concurrent ne correspond aux filtres.</div>';drawMarkers(arr)}
function drawMarkers(arr){markers.forEach(m=>map.removeLayer(m));markers=[];arr.forEach(x=>{let c=coords[x.i];if(c){let s=state[key(x.i)]||{};let m=L.marker(c).addTo(map).bindPopup(`<b>${esc(x.enseigne)}</b><br>${esc(x.commune)}<br><button onclick="openCard(${x.i})">Fiche</button>`);markers.push(m)}})}
async function geocode(arr){let missing=arr.filter(x=>!coords[x.i]).slice(0,20);if(!missing.length)return;document.getElementById('loading').style.display='block';for(const x of missing){try{let q=encodeURIComponent(`${x.adresse}, ${x.cp} ${x.commune}, France`);let r=await fetch(`https://api-adresse.data.gouv.fr/search/?q=${q}&limit=1`);let j=await r.json();if(j.features?.[0]){let [lon,lat]=j.features[0].geometry.coordinates;coords[x.i]=[lat,lon];localStorage.setItem('cc_coords',JSON.stringify(coords))}}catch(e){} await new Promise(r=>setTimeout(r,120))}document.getElementById('loading').style.display='none';drawMarkers(arr)}
function openCard(i){current=i;let x=CONCURRENTS[i],s=state[key(i)]||{};document.getElementById('mh').textContent=x.enseigne;document.getElementById('md').innerHTML=`${esc(x.adresse)}<br>${esc(x.cp)} ${esc(x.commune)}${x.groupe?'<br>'+esc(x.groupe):''}`;document.getElementById('mt').innerHTML=`<span class="tag ${x.priorite==='1'?'p1':x.priorite==='2'?'p2':'p3'}">Priorité P${esc(x.priorite)}</span>`;document.getElementById('notes').value=s.notes||'';document.getElementById('modal').style.display='flex'}
function close(){document.getElementById('modal').style.display='none';current=null}function toggleVisit(i){let s=state[key(i)]||{};s.visited=!s.visited;s.date=s.visited?new Date().toISOString():'';state[key(i)]=s;save();render()}function navigate(i){let x=CONCURRENTS[i],q=encodeURIComponent(`${x.adresse}, ${x.cp} ${x.commune}, France`);window.location.href=`https://maps.apple.com/?address=${q}`}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
document.getElementById('q').oninput=render;document.getElementById('prio').onchange=render;document.getElementById('all').onclick=()=>{document.getElementById('q').value='';document.getElementById('prio').value='';render()};document.getElementById('close').onclick=close;document.getElementById('save').onclick=()=>{let s=state[key(current)]||{};s.notes=document.getElementById('notes').value;state[key(current)]=s;save();close();render()};document.getElementById('backup').onclick=()=>{let blob=new Blob([JSON.stringify({state,coords},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='concurrence-charente-sauvegarde.json';a.click()};document.getElementById('restore').onclick=()=>document.getElementById('file').click();document.getElementById('file').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let j=JSON.parse(r.result);state=j.state||{};coords=j.coords||{};save();localStorage.setItem('cc_coords',JSON.stringify(coords));render()}catch(e){alert('Fichier invalide')}};r.readAsText(f)};
document.getElementById('near').onclick=()=>{if(!navigator.geolocation)return alert('Géolocalisation indisponible');navigator.geolocation.getCurrentPosition(pos=>{let c=[pos.coords.latitude,pos.coords.longitude];if(userMarker)map.removeLayer(userMarker);userMarker=L.circleMarker(c,{radius:9}).addTo(map).bindPopup('Vous êtes ici').openPopup();map.setView(c,12);let arr=CONCURRENTS.map((x,i)=>({...x,i})).filter(x=>coords[x.i]).sort((a,b)=>dist(c,coords[a.i])-dist(c,coords[b.i])).slice(0,20);document.getElementById('q').value='';document.getElementById('prio').value='';document.getElementById('list').innerHTML=arr.map(x=>`<article class="item"><h3>${esc(x.enseigne)}</h3><div class="meta">${esc(x.adresse)}<br>${esc(x.cp)} ${esc(x.commune)}</div><div class="tags"><span class="tag">${Math.round(dist(c,coords[x.i]))} km</span></div><div class="itemActions"><button onclick="openCard(${x.i})">Fiche</button><button onclick="navigate(${x.i})">🚗 Itinéraire</button></div></article>`).join('');drawMarkers(arr)},()=>alert('Autorise la localisation dans Réglages > Confidentialité et sécurité > Service de localisation > Safari.'))};
function dist(a,b){let R=6371,dLat=(b[0]-a[0])*Math.PI/180,dLon=(b[1]-a[1])*Math.PI/180,A=Math.sin(dLat/2)**2+Math.cos(a[0]*Math.PI/180)*Math.cos(b[0]*Math.PI/180)*Math.sin(dLon/2)**2;return R*2*Math.atan2(Math.sqrt(A),Math.sqrt(1-A))}
document.getElementById('tour').onclick=()=>{let arr=filtered().filter(x=>!state[key(x.i)]?.visited).slice(0,10);if(!arr.length)return alert('Aucun concurrent à visiter dans la sélection.');let urls=arr.map(x=>encodeURIComponent(`${x.adresse}, ${x.cp} ${x.commune}`));window.location.href='https://maps.apple.com/?address='+urls.join(',');};
render();geocode(CONCURRENTS.slice(0,80));if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
